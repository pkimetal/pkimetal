name: Docker - Development Build

#Run this action against any commit on main.
on:
  push:
    branches:
        - main
  workflow_dispatch:
  release:
    types: 
      - published
      
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

# Restrict the default token to read-only; the build job elevates as needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Cache main image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-main-cache
          key: ${{ runner.os }}-buildx-main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-main-

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the latest commit hash and timestamp
        id: vars
        run: |
          CONTAINER_TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "CONTAINER_TIMESTAMP=$CONTAINER_TIMESTAMP" >> $GITHUB_ENV
          
      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: gomodfile=dev_go.mod
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          tags: ghcr.io/pkimetal/pkimetal-dev:${{ env.CONTAINER_TIMESTAMP }}
          labels: ghcr.io/pkimetal/pkimetal-dev:${{ env.CONTAINER_TIMESTAMP }}
          platforms: linux/amd64,linux/arm64
          provenance: false

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Verify the just-published image actually starts and serves health checks
      # (a successful build only proves the image compiles and packages).
      - name: Smoke test the published image
        run: |
          IMAGE="ghcr.io/pkimetal/pkimetal-dev:${{ env.CONTAINER_TIMESTAMP }}"
          docker run -d --name pkimetal -p 8080:8080 -p 8081:8081 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/livez >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then
              echo "Service is ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Service did not become ready in time." >&2
              docker logs pkimetal || true
              exit 1
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8081/metrics >/dev/null
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Stop container
        if: always()
        run: docker rm -f pkimetal || true
