name: Scheduled check and build on dependency updates

# Restrict the default token to read-only; the job below elevates as needed.
permissions:
  contents: read

on:
  schedule:
    # Run Hourly
    - cron: '0 * * * *'
  workflow_dispatch:
  
jobs:
  check_release:
    runs-on: ubuntu-latest
    name: Hourly check for dependency updates
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - name: Checkout this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up the latest stable Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: 'stable'

    - name: Setup git
      run: |
          git config --global user.email "gh@pkimet.al"
          git config --global user.name "pkimetal"

    - name: Fetch all branches
      run: git fetch origin

    - name: Run dev_update_dependencies.sh
      run: chmod +x dev_update_dependencies.sh; ./dev_update_dependencies.sh

    - name: Check for changes
      id: check_changes
      run: |
        git fetch origin main
        if [[ $(git diff --name-only origin/main | grep -E 'dev_go\.mod|Dockerfile' ) ]]; then
          echo "Either dev_go.mod and/or Dockerfile have changed"
          echo "dev_files_changed=true" >> $GITHUB_OUTPUT
        else
          echo "Neither dev_go.mod nor Dockerfile have changed"
          echo "dev_files_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.check_changes.outputs.dev_files_changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        add-paths: |
          dev_go.*
          Dockerfile
        token: ${{ secrets.GITHUB_TOKEN }}
        base: main
        branch: auto-dev-update
        title: "Dependency Update"
        body: "This pull request was automatically created due to a dependency update."
        commit-message: Dependency update

    - name: Authenticate GitHub CLI
      if: steps.check_changes.outputs.dev_files_changed == 'true'
      run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
        
    - name: Auto-Merge PR
      if: steps.check_changes.outputs.dev_files_changed == 'true'
      run: |
          gh pr merge auto-dev-update -d -m

    - name: Trigger Dev Container Build
      if: steps.check_changes.outputs.dev_files_changed == 'true'
      run: |
        curl -X POST \
        -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
        -H "Accept: application/vnd.github.v3+json" \
        https://api.github.com/repos/pkimetal/pkimetal/actions/workflows/docker-dev.yml/dispatches \
        -d '{"ref":"main"}'

