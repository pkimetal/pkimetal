# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
  - package-ecosystem: "npm" # Keeps @redocly/cli (doc tooling) pinned in package-lock.json up to date.
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker" # Keeps the digest-pinned base images in the Dockerfile up to date.
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # golang publishes prereleases as non-SemVer tags (e.g. "1.27rc2-alpine3.24")
      # that Dependabot can't filter via `versions`; restricting to patch + digest
      # updates excludes them (minor/major base-image bumps stay manual).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
