# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
  - package-ecosystem: "npm" # Keeps @redocly/cli (doc tooling) pinned in package-lock.json up to date.
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker" # Keeps the digest-pinned base images in the Dockerfile up to date.
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Skip prerelease base images (e.g. golang's "1.27rc2-alpine3.24"), whose
      # non-SemVer tag form defeats Dependabot's built-in prerelease detection.
      - dependency-name: "*"
        versions: ["*rc*", "*alpha*", "*beta*"]
